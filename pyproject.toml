[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-cam"
version = "0.1.0"
description = "Auto-switching virtual webcam driven by head-pose tracking"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.9",
    "mediapipe>=0.10",
    "numpy>=1.26",
    "pyvirtualcam>=0.11",
    "pystray>=0.19",
    "Pillow>=10.0",
]

[project.scripts]
cloud-cam = "cloudcam.main:main"

[tool.setuptools.packages.find]
where = ["src"]
